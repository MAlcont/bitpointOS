[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitpoint-os"
version = "0.2.2"
description = "bpOS: experimental internet-linked wallet key identity and miner-facing overlay"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "bpOS contributors"}]
dependencies = ["cryptography>=42,<47", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bpos = "bpos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
